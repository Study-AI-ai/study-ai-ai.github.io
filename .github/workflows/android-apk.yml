name: Build StudyAI Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "install.js"
      - "app-polish.js"
      - "studyai-logo.svg"
      - "manifest.webmanifest"
      - "icon-192.png"
      - "icon-512.png"
      - "studyai-intro.webp"
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "index.html"
      - "icon-192.png"
      - "icon-512.png"
      - "studyai-intro.webp"
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studyai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout StudyAI
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Android SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found in $ANDROID_HOME"
            exit 1
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Prepare current StudyAI website files
        working-directory: android-app
        run: npm run prepare:web

      - name: Create Android project
        working-directory: android-app
        run: npx cap add android

      - name: Generate official StudyAI Android icon and splash screen
        working-directory: android-app
        run: npm run android:assets

      - name: Sync native Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk build-output/StudyAI.apk
          ls -lh build-output/StudyAI.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Android-APK
          path: build-output/StudyAI.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studyai-android-${{ github.run_number }}
          name: StudyAI Android test build ${{ github.run_number }}
          body: |
            Automated Android APK build for testing StudyAI on Android phones and tablets.

            This is a debug-signed sideload test build, not a Play Store release.
            Online StudyAI features still require an internet connection.
          files: build-output/StudyAI.apk
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
